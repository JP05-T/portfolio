[app:main]
use = egg:portfolio

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.default_locale_name = en
jinja2.directories = portfolio:templates

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, portfolio

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_portfolio]
level = DEBUG
handlers =
qualname = portfolio

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
